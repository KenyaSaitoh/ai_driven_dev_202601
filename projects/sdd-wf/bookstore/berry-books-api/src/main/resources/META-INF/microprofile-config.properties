# Berry Books API - MicroProfile Config
# ==================================

# JWT Configuration
# -----------------
# Secret key for JWT signing (HMAC-SHA256)
# IMPORTANT: Override this in production using environment variables
jwt.secret=your-secret-key-at-least-256-bits-long-for-hs256-algorithm

# External API Configuration
# --------------------------
# back-office-api base URL (books, stock, categories)
back-office-api.base-url=http://localhost:8080/back-office-api/api

# customer-hub-api base URL (customer management)
customer-hub-api.base-url=http://localhost:8080/customer-hub-api/customers
