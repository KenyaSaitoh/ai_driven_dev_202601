plugins {
    id 'java'
    id 'war'
    id 'jacoco'
}

group = 'pro.kensait'
version = '1.0.0'
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta EE 10
    providedCompile 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    
    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    // BCrypt for password hashing
    implementation 'org.mindrot:jbcrypt:0.4'
    
    // Logging (SLF4J + Log4j2)
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.apache.logging.log4j:log4j-core:2.21.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.21.1'
    
    // MicroProfile Config
    providedCompile 'org.eclipse.microprofile.config:microprofile-config-api:3.0.3'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.1'
    testImplementation 'io.cucumber:cucumber-java:7.14.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.1'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    
    // HSQLDB (for testing if needed)
    testImplementation 'org.hsqldb:hsqldb:2.7.2'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/external/dto/**',
                '**/*TO.class',
                '**/*Request.class',
                '**/*Response.class',
                '**/ErrorResponse.class'
            ])
        }))
    }
}

war {
    archiveFileName = 'berry-books-api.war'
}
