/*
 * JEE Web Projects - Multi-project build (Payara Server Edition)
 */

rootProject.name = 'jee-web-projects-payara'

// Master: 完成版プロジェクト（模範解答・手を入れない想定）
include 'berry-books-api'
include 'customer-hub-api'
include 'customer-hub-swing'
include 'back-office-api'
include 'jsf-person'
include 'struts-person'

// SDD: 仕様駆動開発（Specification-Driven Development）プロジェクト
// sdd-wf: ウォーターフォール開発用（仕様→タスク分解→詳細設計→実装の順）
include 'berry-books-api-sdd-wf'
include 'back-office-api-sdd-wf'
include 'customer-hub-api-sdd-wf'
include 'jsf-person-sdd-wf'

// sdd-agile: アジャイル開発用（bookstore をイテレーション単位で仕様駆動）
include 'berry-books-api-sdd-agile'
include 'back-office-api-sdd-agile'

// プロジェクトの物理的な場所を指定
// Master: 完成版プロジェクト（ドメイン別に整理）
project(':berry-books-api').projectDir = file('projects/master/bookstore/berry-books-api')
project(':back-office-api').projectDir = file('projects/master/bookstore/back-office-api')
project(':customer-hub-api').projectDir = file('projects/master/bookstore/customer-hub-api')
project(':customer-hub-swing').projectDir = file('projects/master/bookstore/customer-hub-swing')
project(':jsf-person').projectDir = file('projects/master/person/jsf-person')
project(':struts-person').projectDir = file('projects/master/person/struts-person')

// SDD: 仕様駆動開発プロジェクト（ドメイン別に整理）
// sdd-wf: ウォーターフォール用（フォルダ名にsddは付けない、論理名で識別）
project(':berry-books-api-sdd-wf').projectDir = file('projects/sdd-wf/bookstore/berry-books-api')
project(':back-office-api-sdd-wf').projectDir = file('projects/sdd-wf/bookstore/back-office-api')
project(':customer-hub-api-sdd-wf').projectDir = file('projects/sdd-wf/bookstore/customer-hub-api')
project(':jsf-person-sdd-wf').projectDir = file('projects/sdd-wf/person/jsf-person')

// sdd-agile: アジャイル用（bookstore のみ）
project(':berry-books-api-sdd-agile').projectDir = file('projects/sdd-agile/bookstore/berry-books-api')
project(':back-office-api-sdd-agile').projectDir = file('projects/sdd-agile/bookstore/back-office-api')
